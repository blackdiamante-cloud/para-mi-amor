<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Mi Amor</title>
    <style>
        :root {
            --brown: #4e342e;
            --pink: #ff1744;
            --bg: #fdf5e6;
        }

        body {
            margin: 0; height: 100vh; background: var(--bg);
            font-family: 'Georgia', serif; display: flex;
            justify-content: center; align-items: center; overflow: hidden;
        }

        /* BOTÓN INICIAL */
        #start-button {
            position: absolute; cursor: pointer; font-size: 80px;
            animation: pulse 1.5s infinite; z-index: 100;
            transition: all 0.5s ease;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        /* CONTENEDOR PRINCIPAL */
        .container {
            display: none; width: 95%; max-width: 1000px;
            align-items: center; justify-content: center;
            position: relative; height: 80vh; transition: all 1s ease;
        }

        /* TEXTO (Aparece después) */
        .text-section {
            flex: 1; color: var(--brown); opacity: 0;
            transition: opacity 2s ease; padding: 20px;
        }

        /* ÁRBOL */
        .tree-section {
            flex: 1; position: relative; height: 500px;
            display: flex; justify-content: center; align-items: flex-end;
        }

        .trunk {
            width: 20px; height: 0; background: var(--brown);
            border-radius: 10px 10px 0 0; position: relative;
            transition: height 2s ease; z-index: 5;
        }

        .heart-crown {
            position: absolute; bottom: 120px; width: 350px; height: 350px;
            z-index: 10; opacity: 0;
        }

        /* HOJAS CAYENDO */
        .leaf {
            position: absolute; color: var(--pink);
            user-select: none; animation: leafFall linear forwards;
        }

        @keyframes leafFall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(400px) rotate(720deg); opacity: 0; }
        }

        /* CRONÓMETRO */
        .timer-footer {
            position: absolute; bottom: 20px; left: 5%; width: 90%;
            border-top: 1px solid #d2b48c; padding-top: 15px;
            color: var(--brown); opacity: 0; transition: opacity 2s;
        }

        #timer { font-size: 1.8rem; font-weight: bold; }

        @media (max-width: 768px) {
            .container { flex-direction: column; }
            .tree-section { height: 300px; }
        }
    </style>
</head>
<body>

    <div id="start-button">❤️</div>

    <div class="container" id="mainContainer">
        <div class="text-section" id="textSection">
            <div id="typewriter" style="line-height: 1.8; font-size: 1.3rem;"></div>
        </div>

        <div class="tree-section">
            <div class="trunk" id="trunk"></div>
            <div id="heartShape" class="heart-crown"></div>
        </div>

        <div class="timer-footer" id="timerFooter">
            <p>Nuestro tiempo juntos:</p>
            <div id="timer"></div>
        </div>
    </div>

    <script>
        const startDate = new Date(2025, 1, 14, 0, 0, 0); 
        const message = "Para el amor de mi vida:\nSi pudiera elegir un lugar seguro, sería a tu lado.\nCuanto más tiempo estoy contigo más te amo.\n\n— I Love You!";

        const startBtn = document.getElementById('start-button');
        const container = document.getElementById('mainContainer');
        const trunk = document.getElementById('trunk');
        const crown = document.getElementById('heartShape');
        const textSection = document.getElementById('textSection');
        const timerFooter = document.getElementById('timerFooter');

        startBtn.addEventListener('click', () => {
            // 1. Desaparece botón
            startBtn.style.opacity = '0';
            setTimeout(() => {
                startBtn.style.display = 'none';
                container.style.display = 'flex';
                // 2. Crece tronco
                setTimeout(() => { trunk.style.height = '120px'; }, 100);
                // 3. Aparecen corazones de la copa
                setTimeout(buildTree, 1500);
            }, 500);
        });

        function buildTree() {
            crown.style.opacity = '1';
            const numHearts = 250;
            for (let i = 0; i < numHearts; i++) {
                setTimeout(() => {
                    const t = Math.random() * Math.PI * 2;
                    const x = 16 * Math.pow(Math.sin(t), 3);
                    const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
                    
                    const heart = document.createElement('div');
                    heart.innerHTML = '❤️';
                    heart.style.position = 'absolute';
                    const spread = Math.random();
                    heart.style.left = (175 + x * 9 * spread) + 'px';
                    heart.style.top = (150 + y * 9 * spread) + 'px';
                    heart.style.fontSize = (Math.random() * 10 + 10) + 'px';
                    heart.style.opacity = '0';
                    heart.style.transition = 'opacity 0.5s';
                    crown.appendChild(heart);
                    setTimeout(() => { heart.style.opacity = '0.8'; }, 10);
                }, i * 10); // Efecto de llenado progresivo
            }

            // 4. Mover a un lado y mostrar texto
            setTimeout(() => {
                container.style.justifyContent = 'space-between';
                textSection.style.opacity = '1';
                timerFooter.style.opacity = '1';
                typeWriter();
                setInterval(dropLeaf, 500);
                setInterval(updateTimer, 1000);
                updateTimer();
            }, 3000);
        }

        function typeWriter() {
            let i = 0;
            const target = document.getElementById("typewriter");
            function typing() {
                if (i < message.length) {
                    target.innerHTML += message.charAt(i) === '\n' ? '<br>' : message.charAt(i);
                    i++;
                    setTimeout(typing, 50);
                }
            }
            typing();
        }

        function dropLeaf() {
            const leaf = document.createElement('div');
            leaf.className = 'leaf';
            leaf.innerHTML = '❤️';
            leaf.style.left = (Math.random() * 250 + 50) + 'px';
            leaf.style.top = (Math.random() * 100 + 50) + 'px';
            leaf.style.fontSize = (Math.random() * 12 + 8) + 'px';
            leaf.style.animationDuration = (Math.random() * 2 + 4) + 's';
            crown.appendChild(leaf);
            setTimeout(() => leaf.remove(), 5000);
        }

        function updateTimer() {
            const diff = new Date() - startDate;
            const d = Math.floor(diff / 86400000);
            const h = Math.floor((diff / 3600000) % 24);
            const m = Math.floor((diff / 60000) % 60);
            const s = Math.floor((diff / 1000) % 60);
            document.getElementById('timer').innerText = `${d}d ${h}h ${m}m ${s}s`;
        }
    </script>
</body>
</html>
