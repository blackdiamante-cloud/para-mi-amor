<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <style>
        /* CSS INTEGRADO */
        body { 
            margin: 0; height: 100vh; display: flex; flex-direction: column;
            justify-content: center; align-items: center; 
            background: #fdf5e6; font-family: sans-serif; overflow: hidden; 
        }
        .card { text-align: center; z-index: 10; background: rgba(255,255,255,0.8); padding: 20px; border-radius: 20px; }
        #timer { font-size: 1.5rem; font-weight: bold; color: #d63384; margin-top: 10px; }
        
        /* Animación de los corazones */
        .heart-particle {
            position: absolute;
            color: #ff4d6d;
            font-size: 20px;
            user-select: none;
            animation: moveUp 4s linear infinite;
        }
        @keyframes moveUp {
            0% { transform: translateY(100vh) scale(0); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Para el amor de mi vida ❤️</h1>
        <p>Nuestro tiempo juntos:</p>
        <div id="timer">Cargando contador...</div>
    </div>

    <script>
        // JAVASCRIPT INTEGRADO
        const startDate = new Date(2024, 0, 1, 0, 0, 0); // Ajusta tu fecha aquí (Año, Mes-1, Día)

        function updateTimer() {
            const now = new Date();
            const diff = now - startDate;
            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const m = Math.floor((diff / 1000 / 60) % 60);
            const s = Math.floor((diff / 1000) % 60);
            document.getElementById('timer').innerText = `${d}d ${h}h ${m}m ${s}s`;
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart-particle';
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 4000);
        }

        setInterval(updateTimer, 1000);
        setInterval(createHeart, 300);
        updateTimer();
    </script>
</body>
</html>
