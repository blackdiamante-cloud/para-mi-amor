<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Nuestro Tiempo Juntos</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Georgia', serif;
    }

    body {
        background: linear-gradient(#fff3e8, #fde2e4);
        height: 100vh;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    #startBtn {
        position: absolute;
        background: #ff4d6d;
        color: white;
        border: none;
        padding: 20px 40px;
        font-size: 24px;
        border-radius: 50px;
        cursor: pointer;
        animation: pulse 1.5s infinite;
        z-index: 10;
    }

    @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.1); }
        100% { transform: scale(1); }
    }

    .scene {
        text-align: left;
        width: 80%;
        max-width: 900px;
        opacity: 0;
    }

    .text {
        color: #5a3e36;
        font-size: 22px;
        line-height: 1.6;
    }

    .tree {
        position: absolute;
        bottom: 0;
        right: 10%;
        width: 0;
        height: 0;
        background: #8b5a2b;
        border-radius: 20px;
        transition: all 3s ease;
    }

    .tree.grow {
        width: 30px;
        height: 250px;
    }

    .leaves {
        position: absolute;
        top: -150px;
        left: -110px;
        width: 250px;
        height: 250px;
        opacity: 0;
        transition: opacity 2s ease 2s;
    }

    .tree.grow .leaves {
        opacity: 1;
    }

    .heart {
        position: absolute;
        width: 14px;
        height: 14px;
        background: red;
        transform: rotate(45deg);
        animation: float 6s linear infinite;
    }

    .heart::before,
    .heart::after {
        content: "";
        position: absolute;
        width: 14px;
        height: 14px;
        background: red;
        border-radius: 50%;
    }

    .heart::before {
        top: -7px;
        left: 0;
    }

    .heart::after {
        left: -7px;
        top: 0;
    }

    @keyframes float {
        0% {
            transform: translateY(0) rotate(45deg);
            opacity: 1;
        }
        100% {
            transform: translateY(-600px) rotate(45deg);
            opacity: 0;
        }
    }

    .timer {
        margin-top: 20px;
        font-size: 26px;
        color: #3b2c28;
    }
</style>
</head>

<body>

<button id="startBtn">❤️ Nuestro tiempo juntos</button>

<div class="scene" id="scene">
    <div class="text">
        <p><strong>Para el amor de mi vida:</strong></p><br>
        <p>
            Si pudiera elegir un lugar seguro,<br>
            sería a tu lado.
        </p><br>
        <p>
            Cuanto más tiempo estoy contigo<br>
            más te amo.
        </p><br>
        <p>— I Love You!</p>

        <div class="timer" id="timer"></div>
    </div>
</div>

<div class="tree" id="tree">
    <div class="leaves" id="leaves"></div>
</div>

<script>
    const startBtn = document.getElementById("startBtn");
    const scene = document.getElementById("scene");
    const tree = document.getElementById("tree");
    const timer = document.getElementById("timer");

    const startDate = new Date("2024-02-25T00:00:00");

    startBtn.addEventListener("click", () => {
        startBtn.style.animation = "none";
        startBtn.style.transition = "all 1.5s ease";
        startBtn.style.transform = "translateY(800px)";
        startBtn.style.opacity = 0;

        setTimeout(() => {
            startBtn.remove();
            scene.style.opacity = 1;
            tree.classList.add("grow");
            createHearts();
            startTimer();
        }, 1500);
    });

    function createHearts() {
        setInterval(() => {
            const heart = document.createElement("div");
            heart.className = "heart";
            heart.style.left = Math.random() * window.innerWidth + "px";
            heart.style.bottom = "0px";
            heart.style.animationDuration = 4 + Math.random() * 4 + "s";
            document.body.appendChild(heart);

            setTimeout(() => heart.remove(), 8000);
        }, 300);
    }

    function startTimer() {
        setInterval(() => {
            const now = new Date();
            const diff = now - startDate;

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / (1000 * 60)) % 60);
            const seconds = Math.floor((diff / 1000) % 60);

            timer.innerHTML = `
                Mi amor por ti comenzó hace…<br>
                ${days} días ${hours} horas ${minutes} minutos ${seconds} segundos
            `;
        }, 1000);
    }
</script>

</body>
</html>
