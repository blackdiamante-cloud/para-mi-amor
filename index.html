<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Nuestro Tiempo Juntos</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Georgia', serif;
}

body{
    height:100vh;
    background: linear-gradient(#fff6eb, #fde2e4);
    overflow:hidden;
    position:relative;
}

/* ❤️ BOTÓN CORAZÓN */
#heartBtn{
    position:absolute;
    top:40%;
    left:50%;
    transform:translate(-50%, -50%) rotate(45deg);
    width:120px;
    height:120px;
    background:#ff4d6d;
    cursor:pointer;
    animation:pulse 1.5s infinite;
    z-index:10;
}

#heartBtn::before,
#heartBtn::after{
    content:"";
    position:absolute;
    width:120px;
    height:120px;
    background:#ff4d6d;
    border-radius:50%;
}

#heartBtn::before{ top:-60px; left:0; }
#heartBtn::after{ left:-60px; top:0; }

#heartText{
    position:absolute;
    transform:rotate(-45deg);
    width:200px;
    text-align:center;
    color:white;
    font-size:16px;
    top:45px;
    left:-40px;
    pointer-events:none;
}

@keyframes pulse{
    0%{transform:translate(-50%,-50%) rotate(45deg) scale(1);}
    50%{transform:translate(-50%,-50%) rotate(45deg) scale(1.08);}
    100%{transform:translate(-50%,-50%) rotate(45deg) scale(1);}
}

/* 🧱 PISO */
#ground{
    position:absolute;
    bottom:120px;
    left:50%;
    width:0;
    height:4px;
    background:#c9a27e;
    transform:translateX(-50%);
    opacity:0;
}

/* 🌳 ÁRBOL */
#tree{
    position:absolute;
    bottom:120px;
    left:50%;
    transform:translateX(-50%);
    opacity:0;
}

#trunk{
    width:30px;
    height:0;
    background:#8b5a2b;
    margin:auto;
    border-radius:20px;
}

#crown{
    position:absolute;
    top:-160px;
    left:-110px;
    width:250px;
    height:250px;
    opacity:0;
}

/* 💬 TEXTO */
#textBox{
    position:absolute;
    left:10%;
    top:30%;
    width:35%;
    color:#5a3e36;
    font-size:22px;
    line-height:1.6;
    opacity:0;
}

/* 💘 CORAZONES */
.floating-heart{
    position:absolute;
    width:14px;
    height:14px;
    background:red;
    transform:rotate(45deg);
    animation:float 6s linear infinite;
}

.floating-heart::before,
.floating-heart::after{
    content:"";
    position:absolute;
    width:14px;
    height:14px;
    background:red;
    border-radius:50%;
}

.floating-heart::before{ top:-7px; left:0; }
.floating-heart::after{ left:-7px; top:0; }

@keyframes float{
    from{transform:translateY(0) rotate(45deg); opacity:1;}
    to{transform:translateY(-600px) rotate(45deg); opacity:0;}
}
</style>
</head>

<body>

<!-- ❤️ BOTÓN -->
<div id="heartBtn">
    <div id="heartText">Nuestro tiempo juntos</div>
</div>

<!-- 🧱 PISO -->
<div id="ground"></div>

<!-- 🌳 ÁRBOL -->
<div id="tree">
    <div id="trunk"></div>
    <div id="crown"></div>
</div>

<!-- 💬 TEXTO -->
<div id="textBox">
    <p><strong>Para Sonia el amor de mi vida:</strong></p><br>
    <p>Si pudiera elegir un lugar seguro,<br>sería a tu lado.</p><br>
    <p>Cuanto más tiempo estoy contigo,<br>más te amo.</p><br>
    <p>— I Love You!</p>
    <br>
    <div id="timer"></div>
</div>

<script>
const btn = document.getElementById("heartBtn");
const ground = document.getElementById("ground");
const tree = document.getElementById("tree");
const trunk = document.getElementById("trunk");
const crown = document.getElementById("crown");
const text = document.getElementById("textBox");
const timer = document.getElementById("timer");

const startDate = new Date("2010-09-25T00:00:00");

btn.onclick = () => {
    btn.style.animation = "none";
    btn.style.transition = "top 1.2s ease-in";
    btn.style.top = "80%";

    setTimeout(() => {
        ground.style.opacity = 1;
        ground.style.transition = "width 1.2s ease";
        ground.style.width = "60%";
    }, 1200);

    setTimeout(() => {
        btn.remove();
        tree.style.opacity = 1;
        trunk.style.transition = "height 2s ease";
        trunk.style.height = "240px";
    }, 2500);

    setTimeout(() => {
        crown.style.opacity = 1;
        generateCrown();
    }, 4300);

    setTimeout(() => {
        tree.style.transition = "left 2s ease";
        tree.style.left = "70%";
    }, 6500);

    setTimeout(() => {
        text.style.transition = "opacity 2s ease";
        text.style.opacity = 1;
        hearts();
        timerStart();
    }, 8200);
};

function generateCrown(){
    for(let i=0;i<120;i++){
        const h=document.createElement("div");
        h.className="floating-heart";
        h.style.position="absolute";
        h.style.left=Math.random()*250+"px";
        h.style.top=Math.random()*250+"px";
        crown.appendChild(h);
    }
}

function hearts(){
    setInterval(()=>{
        const h=document.createElement("div");
        h.className="floating-heart";
        h.style.left=Math.random()*window.innerWidth+"px";
        h.style.bottom="0";
        document.body.appendChild(h);
        setTimeout(()=>h.remove(),6000);
    },300);
}

function timerStart(){
    setInterval(()=>{
        const diff=new Date()-startDate;
        const d=Math.floor(diff/86400000);
        const h=Math.floor(diff/3600000)%24;
        const m=Math.floor(diff/60000)%60;
        const s=Math.floor(diff/1000)%60;
        timer.innerHTML=`Mi amor por ti comenzó hace…<br>${d} días ${h} horas ${m} minutos ${s} segundos`;
    },1000);
}
</script>

</body>
</html>
