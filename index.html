<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para el amor de mi vida</title>
    <style>
        :root {
            --text-color: #5a3e2b;
            --heart-red: #ff4d6d;
            --bg-color: #fdf5e6;
        }

        body {
            margin: 0; height: 100vh; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            background: var(--bg-color); font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        .container {
            display: flex; width: 95%; max-width: 900px;
            align-items: center; justify-content: space-around;
            z-index: 10;
        }

        /* TEXTO CON ENTRADA SUAVE */
        .text-section {
            flex: 1.2; color: var(--text-color);
            animation: fadeInSlide 2s ease-out forwards;
        }

        @keyframes fadeInSlide {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .text-section p { font-size: 1.3rem; margin: 12px 0; }
        .greeting { font-size: 1.6rem; font-weight: bold; }

        /* ÁRBOL Y HOJAS CAYENDO */
        .tree-section {
            flex: 1; position: relative; height: 400px;
            display: flex; justify-content: center; align-items: flex-end;
        }

        .trunk {
            width: 22px; height: 100px; background: #5d4037;
            border-radius: 4px 4px 0 0; position: relative; z-index: 5;
        }

        .tree-crown {
            position: absolute; bottom: 85px; width: 300px; height: 300px;
            z-index: 4;
        }

        /* Animación de las hojas (corazones) que caen del árbol */
        .falling-leaf {
            position: absolute; color: var(--heart-red);
            user-select: none; pointer-events: none;
            animation: leafFall 5s linear forwards;
        }

        @keyframes leafFall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(300px) rotate(360deg); opacity: 0; }
        }

        /* CONTADOR ESTILO GIF */
        .timer-section {
            width: 90%; max-width: 800px; margin-top: 50px;
            border-top: 2px solid #8d6e63; padding-top: 20px;
            color: var(--text-color);
        }

        #timer { font-size: 1.8rem; font-weight: bold; color: #3e2723; }
        .unit { font-size: 1rem; font-weight: normal; margin-right: 10px; }

        @media (max-width: 600px) {
            .container { flex-direction: column; text-align: center; }
            .tree-section { height: 280px; margin-top: 20px; }
            #timer { font-size: 1.3rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="text-section">
            <p class="greeting">Sonia el amor de mi vida:</p>
            <p>Si pudiera elegir un lugar seguro, sería a tu lado.</p>
            <p>Cuanto más tiempo estoy contigo más te amo.</p>
            <p><strong>— I Love You!</strong></p>
        </div>

        <div class="tree-section">
            <div class="trunk"></div>
            <div id="treeCrown" class="tree-crown"></div>
        </div>
    </div>

    <div class="timer-section">
        <p>Mi amor por ti comenzó hace...</p>
        <div id="timer">Calculando...</div>
    </div>

    <script>
        const startDate = new Date(2010, 9, 31, 0, 0, 0); // Ajusta tu fecha aquí

        function updateTimer() {
            const now = new Date();
            const diff = now - startDate;
            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const m = Math.floor((diff / 1000 / 60) % 60);
            const s = Math.floor((diff / 1000) % 60);
            document.getElementById('timer').innerHTML = 
                `${d} <span class="unit">días</span> ${h} <span class="unit">horas</span> ${m} <span class="unit">min</span> ${s} <span class="unit">seg</span>`;
        }

        // Crear la forma de corazón para el árbol (Fórmula Cardioide)
        function buildHeartTree() {
            const crown = document.getElementById('treeCrown');
            const totalHearts = 100;
            
            for (let i = 0; i < totalHearts; i++) {
                const t = (i / totalHearts) * Math.PI * 2;
                // Fórmula matemática del corazón
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
                
                const heart = document.createElement('div');
                heart.innerHTML = '❤️';
                heart.style.position = 'absolute';
                // Escalar y centrar
                heart.style.left = (x * 7 + 150) + 'px';
                heart.style.top = (y * 7 + 130) + 'px';
                heart.style.fontSize = (Math.random() * 10 + 10) + 'px';
                heart.style.opacity = Math.random() * 0.5 + 0.5;
                crown.appendChild(heart);
            }
        }

        // Animación de hojas cayendo del árbol
        function dropLeaf() {
            const crown = document.getElementById('treeCrown');
            const leaf = document.createElement('div');
            leaf.className = 'falling-leaf';
            leaf.innerHTML = Math.random() > 0.5 ? '❤️' : '💖';
            
            // Que caigan desde posiciones aleatorias del árbol
            leaf.style.left = (Math.random() * 200 + 50) + 'px';
            leaf.style.top = (Math.random() * 150 + 50) + 'px';
            leaf.style.fontSize = (Math.random() * 10 + 8) + 'px';
            
            crown.appendChild(leaf);
            setTimeout(() => leaf.remove(), 5000);
        }

        // Iniciar
        buildHeartTree();
        setInterval(updateTimer, 1000);
        setInterval(dropLeaf, 400); // Crea una hoja nueva cada 400ms
        updateTimer();
    </script>
</body>
</html>
