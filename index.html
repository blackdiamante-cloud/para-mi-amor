<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Mi Amor</title>
    <style>
        :root {
            --brown: #4e342e;
            --pink-red: #ff1744;
            --bg: #fffcf5;
        }

        body {
            margin: 0; height: 100vh; background: var(--bg);
            font-family: 'Georgia', serif; display: flex;
            justify-content: center; align-items: center; overflow: hidden;
        }

        .canvas {
            display: flex; width: 95%; max-width: 1000px;
            align-items: center; justify-content: space-between;
            position: relative; height: 85vh;
        }

        /* TEXTO */
        .text-box { flex: 1; color: var(--brown); font-size: 1.2rem; padding: 20px; z-index: 20; }
        .typewriter-text { line-height: 1.6; white-space: pre-wrap; }

        /* EL ÁRBOL FRONDOSO */
        .tree-box {
            flex: 1; position: relative; height: 500px;
            display: flex; justify-content: center; align-items: flex-end;
        }

        .trunk {
            width: 24px; height: 130px; background: var(--brown);
            border-radius: 10px 10px 0 0; position: relative;
            z-index: 5; box-shadow: inset -5px 0 5px rgba(0,0,0,0.2);
        }

        /* Ramas del tronco */
        .trunk::before { content: ''; position: absolute; top: 40px; left: -25px; width: 35px; height: 12px; background: var(--brown); transform: rotate(-35deg); border-radius: 5px; }
        .trunk::after { content: ''; position: absolute; top: 20px; right: -25px; width: 35px; height: 12px; background: var(--brown); transform: rotate(35deg); border-radius: 5px; }

        .heart-crown {
            position: absolute; bottom: 110px; width: 350px; height: 350px;
            z-index: 10; animation: gentlePulse 4s infinite ease-in-out;
        }

        @keyframes gentlePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }

        .leaf {
            position: absolute; color: var(--pink-red);
            user-select: none; pointer-events: none; z-index: 15;
            animation: leafFall linear forwards;
        }

        @keyframes leafFall {
            0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 1; }
            25% { transform: translateY(100px) translateX(15px) rotate(90deg); }
            50% { transform: translateY(200px) translateX(-15px) rotate(180deg); }
            75% { transform: translateY(300px) translateX(15px) rotate(270deg); }
            100% { transform: translateY(450px) translateX(0) rotate(360deg); opacity: 0; }
        }

        /* CRONÓMETRO */
        .footer-timer {
            position: absolute; bottom: 20px; left: 5%; width: 90%;
            border-top: 1px solid #d7ccc8; padding-top: 15px; color: var(--brown);
        }
        #timer-display { font-size: 1.8rem; font-weight: bold; }
        .unit { font-size: 0.9rem; margin-right: 10px; opacity: 0.7; }

        @media (max-width: 768px) {
            .canvas { flex-direction: column; text-align: center; }
            .tree-box { height: 300px; width: 100%; }
            .heart-crown { width: 250px; height: 250px; bottom: 80px; }
            #timer-display { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <div class="canvas">
        <div class="text-box">
            <div id="typewriter" class="typewriter-text"></div>
        </div>

        <div class="tree-box">
            <div class="trunk"></div>
            <div id="heartShape" class="heart-crown"></div>
        </div>

        <div class="footer-timer">
            <p>Nuestro tiempo juntos:</p>
            <div id="timer-display"></div>
        </div>
    </div>

    <script>
        const startDate = new Date(2025, 0, 1, 0, 0, 0); 
        const message = "Para el amor de mi vida:\nSi pudiera elegir un lugar seguro, sería a tu lado.\nCuanto más tiempo estoy contigo más te amo.\n\n— I Love You!";
        let charIndex = 0;
        function type() {
            if (charIndex < message.length) {
                document.getElementById("typewriter").innerHTML += message.charAt(charIndex) === '\n' ? '<br>' : message.charAt(charIndex);
                charIndex++;
                setTimeout(type, 60);
            }
        }
        function buildDenseTree() {
            const container = document.getElementById('heartShape');
            const numHearts = 300; // ¡Aumentamos la cantidad para que sea frondoso!
            
            for (let i = 0; i < numHearts; i++) {
                const t = Math.random() * Math.PI * 2;
                const r = 11; // Radio de escala
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
                
                const heart = document.createElement('div');
                heart.innerHTML = i % 5 === 0 ? '💖' : '❤️'; // Mezcla de colores
                heart.style.position = 'absolute';
                
                // Relleno aleatorio dentro de la forma
                const spread = Math.sqrt(Math.random()); 
                heart.style.left = (175 + x * r * spread) + 'px';
                heart.style.top = (150 + y * r * spread) + 'px';
                heart.style.fontSize = (Math.random() * 12 + 10) + 'px';
                heart.style.opacity = Math.random() * 0.5 + 0.5;
                heart.style.transform = `rotate(${Math.random() * 360}deg)`;
                
                container.appendChild(heart);
            }
        }
        function leafFall() {
            const container = document.getElementById('heartShape');
            const leaf = document.createElement('div');
            leaf.className = 'leaf';
            leaf.innerHTML = '❤️';
            
            // Punto de origen aleatorio dentro de la copa
            leaf.style.left = (Math.random() * 250 + 50) + 'px';
            leaf.style.top = (Math.random() * 100 + 50) + 'px';
            leaf.style.fontSize = (Math.random() * 10 + 12) + 'px';
            
            // Velocidad aleatoria
            leaf.style.animationDuration = (Math.random() * 2 + 4) + 's';
            
            container.appendChild(leaf);
            setTimeout(() => leaf.remove(), 6000);
        }

        function updateTimer() {
            const diff = new Date() - startDate;
            const d = Math.floor(diff / 86400000);
            const h = Math.floor((diff / 3600000) % 24);
            const m = Math.floor((diff / 60000) % 60);
            const s = Math.floor((diff / 1000) % 60);
            document.getElementById('timer-display').innerHTML = 
                `${d}<span class="unit">d</span> ${h}<span class="unit">h</span> ${m}<span class="unit">m</span> ${s}<span class="unit">s</span>`;
        }

        // INICIAR
        type();
        buildDenseTree();
        setInterval(updateTimer, 1000);
        setInterval(leafFall, 400); // Una hoja cada 400ms
        updateTimer();
    </script>
</body>
</html>
