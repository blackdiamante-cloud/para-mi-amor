<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Sonia el amor de mi vida</title>
    <style>
        :root {
            --text-color: #5a3e2b;
            --heart-red: #ff4d6d;
            --bg-color: #fdf5e6;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .container {
            width: 90%;
            max-width: 800px;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            position: relative;
            z-index: 10;
        }

        /* Lado Izquierdo: Texto */
        .text-section {
            flex: 1;
            padding-right: 20px;
            color: var(--text-color);
        }

        .text-section p { font-size: 1.2rem; margin: 10px 0; line-height: 1.5; }
        .greeting { font-size: 1.4rem !important; margin-bottom: 20px !important; }
        .signature { font-weight: bold; margin-top: 20px !important; }

        /* Lado Derecho: Árbol */
        .tree-section {
            flex: 1;
            position: relative;
            height: 400px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        .trunk {
            width: 20px;
            height: 100px;
            background: #6d4c41;
            border-radius: 5px;
            position: relative;
        }

        /* La copa del árbol hecha de corazones */
        .tree-crown {
            position: absolute;
            bottom: 90px;
            width: 250px;
            height: 250px;
        }

        /* Cronómetro Inferior */
        .timer-container {
            position: absolute;
            bottom: 10%;
            left: 5%;
            width: 90%;
            border-top: 2px solid var(--text-color);
            padding-top: 15px;
            color: var(--text-color);
        }

        #timer { font-size: 1.8rem; font-weight: bold; }

        /* Corazones flotantes del fondo */
        .floating-heart {
            position: absolute;
            color: var(--heart-red);
            opacity: 0.6;
            pointer-events: none;
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(110vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        /* Responsive para celulares */
        @media (max-width: 600px) {
            .container { flex-direction: column; text-align: center; }
            .text-section { padding-right: 0; }
            .tree-section { height: 250px; margin-top: 20px; }
            .tree-crown { width: 180px; height: 180px; bottom: 60px; }
            #timer { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="text-section">
            <p class="greeting">Sonia mi Amor:</p>
            <p>Si pudiera elegir un lugar seguro, sería a tu lado.</p>
            <p>Cuanto más tiempo estoy contigo más te amo.</p>
            <p class="signature">— I Love You!</p>
        </div>

        <div class="tree-section">
            <div class="trunk"></div>
            <div class="tree-crown" id="treeCrown"></div>
        </div>
    </div>

    <div class="timer-container">
        <p>Mi amor por ti comenzó hace...</p>
        <div id="timer">000 días 00 horas 00 min 00 seg</div>
    </div>

    <script>
        // 1. CONFIGURA TU FECHA AQUÍ
        const startDate = new Date(2010, 9, 31, 0, 0, 0); // Año, Mes(0-11), Día...

        // 2. Lógica del Contador
        function updateTimer() {
            const now = new Date();
            const diff = now - startDate;
            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const m = Math.floor((diff / 1000 / 60) % 60);
            const s = Math.floor((diff / 1000) % 60);
            document.getElementById('timer').innerText = 
                `${d} días ${h} horas ${m} minutos ${s} segundos`;
        }

        // 3. Generar el árbol de corazones
        function buildTree() {
            const crown = document.getElementById('treeCrown');
            for (let i = 0; i < 60; i++) {
                const heart = document.createElement('div');
                heart.innerHTML = '❤️';
                heart.style.position = 'absolute';
                // Posicionamiento aleatorio dentro de un círculo para formar la copa
                const angle = Math.random() * Math.PI * 2;
                const radius = Math.random() * 100;
                heart.style.left = (125 + Math.cos(angle) * radius) + 'px';
                heart.style.top = (125 + Math.sin(angle) * radius) + 'px';
                heart.style.fontSize = (Math.random() * 15 + 10) + 'px';
                heart.style.transform = `rotate(${Math.random() * 360}deg)`;
                heart.style.opacity = Math.random();
                crown.appendChild(heart);
            }
        }

        // 4. Lluvia de corazones al fondo
        function spawnHeart() {
            const h = document.createElement('div');
            h.className = 'floating-heart';
            h.innerHTML = '❤️';
            h.style.left = Math.random() * 100 + 'vw';
            h.style.fontSize = (Math.random() * 20 + 10) + 'px';
            h.style.animationDuration = (Math.random() * 3 + 4) + 's';
            document.body.appendChild(h);
            setTimeout(() => h.remove(), 6000);
        }

        // Iniciar todo
        setInterval(updateTimer, 1000);
        setInterval(spawnHeart, 400);
        buildTree();
        updateTimer();
    </script>
</body>
</html>
