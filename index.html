<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestro Tiempo Juntos</title>
    <style>
        :root {
            --color-text: #5d4037;
            --color-heart: #ff4d6d;
            --bg-creme: #fdf5e6;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-color: var(--bg-creme);
            font-family: 'Georgia', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .main-card {
            display: flex;
            width: 90%;
            max-width: 900px;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        /* --- SECCIÓN DE TEXTO --- */
        .text-container {
            flex: 1;
            padding: 20px;
            color: var(--color-text);
            animation: fadeInText 3s ease-in-out;
        }

        @keyframes fadeInText {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .greeting { font-size: 1.5rem; margin-bottom: 20px; }
        .quote { font-style: italic; font-size: 1.2rem; line-height: 1.6; margin: 10px 0; }
        .signature { font-weight: bold; margin-top: 30px; font-size: 1.4rem; }

        /* --- SECCIÓN DEL ÁRBOL --- */
        .tree-container {
            flex: 1;
            position: relative;
            height: 450px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        .trunk {
            width: 25px;
            height: 120px;
            background: linear-gradient(to right, #5d4037, #795548);
            border-radius: 10px 10px 0 0;
            position: relative;
            z-index: 5;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
        }

        /* Ramas laterales */
        .trunk::before, .trunk::after {
            content: '';
            position: absolute;
            background: #5d4037;
            width: 10px;
            height: 40px;
            border-radius: 5px;
        }
        .trunk::before { transform: rotate(-45deg); top: 20px; left: -15px; }
        .trunk::after { transform: rotate(45deg); top: 10px; right: -15px; }

        .heart-crown {
            position: absolute;
            bottom: 100px;
            width: 320px;
            height: 300px;
            z-index: 10;
        }

        /* --- PARTÍCULAS Y HOJAS --- */
        .leaf {
            position: absolute;
            color: var(--color-heart);
            user-select: none;
            pointer-events: none;
            z-index: 15;
            filter: drop-shadow(0 0 2px rgba(255,255,255,0.5));
        }

        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(400px) rotate(360deg); opacity: 0; }
        }

        /* --- CRONÓMETRO INFERIOR --- */
        .timer-bar {
            position: absolute;
            bottom: 50px;
            left: 5%;
            width: 90%;
            border-top: 2px solid #d7ccc8;
            padding-top: 15px;
            color: var(--color-text);
        }

        .timer-label { font-size: 1.1rem; margin-bottom: 5px; }
        #clock { font-size: 2rem; font-weight: bold; letter-spacing: 1px; }
        .unit { font-size: 0.9rem; font-weight: normal; margin-right: 15px; color: #8d6e63; }

        @media (max-width: 768px) {
            .main-card { flex-direction: column; text-align: center; }
            .tree-container { height: 300px; width: 100%; }
            #clock { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="text-container">
            <p class="greeting">Para Sonia el amor de mi vida:</p>
            <p class="quote">"Si pudiera elegir un lugar seguro, sería a tu lado."</p>
            <p class="quote">"Cuanto más tiempo estoy contigo, más te amo."</p>
            <p class="signature">— I Love You!</p>
        </div>

        <div class="tree-container">
            <div class="trunk"></div>
            <div id="heartCrown" class="heart-crown"></div>
        </div>

        <div class="timer-bar">
            <p class="timer-label">Mi amor por ti comenzó hace...</p>
            <div id="clock">Cargando tiempo...</div>
        </div>
    </div>

    <script>
        // 1. CONFIGURACIÓN DE TU FECHA
        const startDate = new Date(2010, 9, 31, 0, 0, 0); 

        // 2. RELOJ EN TIEMPO REAL
        function updateClock() {
            const now = new Date();
            const diff = now - startDate;

            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const m = Math.floor((diff / 1000 / 60) % 60);
            const s = Math.floor((diff / 1000) % 60);

            document.getElementById('clock').innerHTML = 
                `${d}<span class="unit">d</span> ${h}<span class="unit">h</span> ${m}<span class="unit">m</span> ${s}<span class="unit">s</span>`;
        }

        // 3. GENERAR COPA DE CORAZÓN (Fórmula Cardioide)
        function initTree() {
            const crown = document.getElementById('heartCrown');
            const heartsInCrown = 120;

            for (let i = 0; i < heartsInCrown; i++) {
                const t = Math.random() * Math.PI * 2;
                // Ecuación paramétrica del corazón para la forma de la copa
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
                
                const heart = document.createElement('div');
                heart.innerHTML = '❤️';
                heart.style.position = 'absolute';
                
                // Distribución aleatoria dentro del área del corazón
                const spread = Math.random();
                heart.style.left = (160 + x * 8 * spread) + 'px';
                heart.style.top = (130 + y * 8 * spread) + 'px';
                heart.style.fontSize = (Math.random() * 10 + 12) + 'px';
                heart.style.opacity = Math.random() * 0.6 + 0.4;
                heart.style.transform = `rotate(${Math.random() * 30 - 15}deg)`;
                
                crown.appendChild(heart);
            }
        }

        // 4. ANIMACIÓN DE HOJAS CAYENDO (Cae una cada tanto)
        function spawnLeaf() {
            const crown = document.getElementById('heartCrown');
            const leaf = document.createElement('div');
            leaf.className = 'leaf';
            leaf.innerHTML = Math.random() > 0.5 ? '❤️' : '💖';
            
            // Inicia en una posición aleatoria de la copa
            leaf.style.left = (Math.random() * 240 + 40) + 'px';
            leaf.style.top = (Math.random() * 200) + 'px';
            leaf.style.fontSize = (Math.random() * 10 + 10) + 'px';
            
            // Aplicar animación de caída
            leaf.style.animation = `fall ${Math.random() * 2 + 4}s linear forwards`;
            
            crown.appendChild(leaf);
            
            // Eliminar del código después de que caiga para no saturar la memoria
            setTimeout(() => leaf.remove(), 6000);
        }

        // INICIALIZACIÓN
        initTree();
        setInterval(updateClock, 1000);
        setInterval(spawnLeaf, 500); // Crea una hoja que cae cada 0.5 segundos
        updateClock();
    </script>
</body>
</html>
