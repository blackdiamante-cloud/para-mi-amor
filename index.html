<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para el amor de mi vida Sonia</title>
    <style>
        :root {
            --text-color: #5a3e2b;
            --heart-red: #ff4d6d;
            --bg-color: #fdf5e6;
        }

        body {
            margin: 0; height: 100vh; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            background: var(--bg-color); font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        /* Contenedor Principal con animación de entrada */
        .container {
            display: flex; width: 90%; max-width: 800px;
            align-items: center; justify-content: space-around;
            animation: fadeIn 2s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Sección de Texto */
        .text-section {
            flex: 1; color: var(--text-color);
            animation: slideIn 1.5s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-50px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .text-section p { font-size: 1.2rem; margin: 10px 0; }
        .greeting { font-size: 1.5rem; font-weight: bold; }

        /* Sección del Árbol */
        .tree-section {
            flex: 1; position: relative; height: 350px;
            display: flex; justify-content: center; align-items: flex-end;
        }

        .trunk {
            width: 18px; height: 80px; background: #6d4c41;
            border-radius: 4px; position: relative; z-index: 2;
        }

        .tree-crown {
            position: absolute; bottom: 70px; width: 220px; height: 220px;
            z-index: 3; animation: pulse 3s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* Contador */
        .timer-section {
            width: 90%; max-width: 800px; margin-top: 40px;
            border-top: 2px solid #d2b48c; padding-top: 20px;
            color: var(--text-color); text-align: left;
        }

        #timer { font-size: 1.6rem; font-weight: bold; margin-top: 5px; }

        /* Corazones del árbol */
        .tree-heart {
            position: absolute; color: var(--heart-red);
            cursor: default; user-select: none;
        }

        /* Corazones flotantes del fondo */
        .floating-heart {
            position: absolute; color: var(--heart-red);
            opacity: 0.5; pointer-events: none;
            animation: flyUp linear infinite;
        }

        @keyframes flyUp {
            0% { transform: translateY(105vh) scale(0.5); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }

        @media (max-width: 600px) {
            .container { flex-direction: column; text-align: center; }
            .tree-section { height: 200px; }
            #timer { font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="text-section">
            <p class="greeting">Para el amor de mi vida:</p>
            <p>Si pudiera elegir un lugar seguro, sería a tu lado.</p>
            <p>Cuanto más tiempo estoy contigo más te amo.</p>
            <p><strong>— I Love You!</strong></p>
        </div>

        <div class="tree-section">
            <div class="trunk"></div>
            <div class="tree-crown" id="treeCrown"></div>
        </div>
    </div>

    <div class="timer-section">
        <p>Mi amor por ti comenzó hace...</p>
        <div id="timer">Cargando...</div>
    </div>

    <script>
        // CONFIGURACIÓN DE FECHA
        const startDate = new Date(2010, 9, 30, 0, 0, 0); 

        // Contador
        function updateTimer() {
            const now = new Date();
            const diff = now - startDate;
            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const m = Math.floor((diff / 1000 / 60) % 60);
            const s = Math.floor((diff / 1000) % 60);
            document.getElementById('timer').innerText = `${d} días ${h}h ${m}m ${s}s`;
        }

        // Construir el árbol de corazones
        function createTree() {
            const crown = document.getElementById('treeCrown');
            const heartIcons = ['❤️', '💖', '💗', '💓'];
            for (let i = 0; i < 80; i++) {
                const h = document.createElement('div');
                h.className = 'tree-heart';
                h.innerHTML = heartIcons[Math.floor(Math.random() * heartIcons.length)];
                
                // Distribución circular
                const angle = Math.random() * Math.PI * 2;
                const radius = Math.random() * 90;
                const x = 110 + Math.cos(angle) * radius;
                const y = 110 + Math.sin(angle) * radius;
                
                h.style.left = x + 'px';
                h.style.top = y + 'px';
                h.style.fontSize = (Math.random() * 12 + 12) + 'px';
                h.style.transform = `rotate(${Math.random() * 40 - 20}deg)`;
                h.style.opacity = Math.random() * 0.5 + 0.5;
                crown.appendChild(h);
            }
        }

        // Corazones de fondo
        function spawnBackgroundHeart() {
            const h = document.createElement('div');
            h.className = 'floating-heart';
            h.innerHTML = '❤️';
            h.style.left = Math.random() * 100 + 'vw';
            h.style.fontSize = (Math.random() * 15 + 10) + 'px';
            h.style.animationDuration = (Math.random() * 3 + 5) + 's';
            document.body.appendChild(h);
            setTimeout(() => h.remove(), 7000);
        }

        setInterval(updateTimer, 1000);
        setInterval(spawnBackgroundHeart, 450);
        createTree();
        updateTimer();
    </script>
</body>
</html>
