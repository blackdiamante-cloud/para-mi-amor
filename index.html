<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para el amor de mi vida</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <div class="content">
            <div class="text-section">
                <p class="greeting">Para el amor de mi vida:</p>
                <p class="quote">Si pudiera elegir un lugar seguro, sería a tu lado.</p>
                <p class="quote">Cuanto más tiempo estoy contigo más te amo.</p>
                <p class="signature">— I Love You!</p>
            </div>
            
            <div class="tree-container">
                <div class="tree-trunk"></div>
                <div class="heart-crown" id="heartCrown"></div>
            </div>
        </div>

        <div class="timer-section">
            <p>Mi amor por ti comenzó hace...</p>
            <div id="timer">
                <span id="days">000</span> días 
                <span id="hours">00</span> horas 
                <span id="minutes">00</span> minutos 
                <span id="seconds">00</span> segundos
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
